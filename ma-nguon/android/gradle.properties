org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# ─────────────────────────────────────────────────────────────
# LƯU Ý VỀ PHIÊN BẢN JDK — đọc kỹ nếu build bị lỗi
#
# Android Studio 2026.1 đi kèm JDK 25 (JBR). Gradle 8.7 chỉ hỗ trợ tới JDK 21,
# nên nếu để mặc định thì build sẽ hỏng với lỗi kiểu:
#     "Unsupported class file major version"
#     hoặc "Could not determine java version from '25'"
#
# Cách xử lý:
#   - Build bằng dòng lệnh : dùng tools\build-apk.ps1 — script tự trỏ sang JDK 17
#   - Build trong Android Studio : File → Settings → Build, Execution, Deployment
#       → Build Tools → Gradle → mục "Gradle JDK" → chọn JDK 17
#       (C:\Program Files\Microsoft\jdk-17.0.20.8-hotspot)
#
# compileOptions trong app/build.gradle.kts vẫn để Java 11 — đó là mức bytecode
# xuất ra, đúng yêu cầu của OrionStar. Hai con số 17 và 11 khác nhau là bình thường:
# JDK 17 để CHẠY Gradle, bytecode kết quả ở mức 11.
# ─────────────────────────────────────────────────────────────
